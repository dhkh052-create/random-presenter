<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 수도 정복</title>
<meta name="author" content="곱단이 선생님">
<meta name="description" content="세계 지도에서 나라를 클릭하고 수도를 맞혀 세계를 정복하는 게임 · 제작 곱단이 선생님">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#22303f; --sub:#5d6b7a; --sea:#d9eefb; --card:#ffffff; --red:#d8343c; --gold:#f2b632; --green:#1f9d6b; --blue:#2f7de1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:linear-gradient(180deg,#eaf6ff,#fdf7ec); color:var(--ink); font-family:'Noto Sans KR','Malgun Gothic',sans-serif; min-height:100%; }
  .jua { font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; }
  .wrap { max-width:1400px; margin:0 auto; padding:10px 16px 20px; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:8px; }
  h1 { margin:0; font-family:'Jua',sans-serif; font-weight:400; font-size:30px; color:#1d4f91; letter-spacing:-.5px; }
  h1 span { color:var(--red); }
  .pill { background:#fff; border-radius:999px; padding:6px 14px; box-shadow:0 2px 0 rgba(0,0,0,.08); font-family:'Jua',sans-serif; font-size:17px; white-space:nowrap; }
  .pill b { color:var(--red); font-weight:400; }
  .spacer { flex:1; }
  .tabs { display:flex; background:#fff; border-radius:999px; padding:4px; box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .tabs button { border:0; background:transparent; font-family:'Jua',sans-serif; font-size:16px; padding:6px 14px; border-radius:999px; cursor:pointer; color:var(--sub); }
  .tabs button.on { background:#1d4f91; color:#fff; }
  .btn { border:0; border-radius:12px; padding:9px 14px; font-family:'Jua',sans-serif; font-size:16px; cursor:pointer; background:#eef2f7; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .btn.primary { background:var(--blue); color:#fff; box-shadow:0 3px 0 #1d5bb0; }
  .btn.gold { background:#ffd65a; color:#5a4200; box-shadow:0 3px 0 #d6a91f; }
  .btn.ghost { background:#fff; }
  .btn:disabled { opacity:.45; cursor:default; transform:none; }

  .main { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:14px; align-items:start; }
  .mapbox { position:relative; background:var(--sea); border-radius:20px; overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.07), inset 0 0 0 2px #c3e1f5; }
  #map { display:block; width:100%; height:auto; aspect-ratio:960/500; cursor:grab; touch-action:none; }
  #map:active { cursor:grabbing; }
  #map path { stroke:#ffffff; stroke-width:.7; vector-effect:non-scaling-stroke; stroke-linejoin:round; transition:fill .25s; }
  #map path.c { cursor:pointer; }
  #map path.c:hover { filter:brightness(.92); }
  #map path.nodata { fill:#e3e6ea; cursor:default; }
  .k-AS { fill:#f6d59e; } .k-EU { fill:#bcd5f3; } .k-AF { fill:#f2bd97; }
  .k-NA { fill:#c4e3b7; } .k-SA { fill:#e3c6e6; } .k-OC { fill:#b2e2dd; }
  .k-plain { fill:#cfd8e2; }
  #map .win { fill:#1f9d6b; }
  #map path.win { stroke:#e9fff4; }
  #map .fail { fill:#f39a92; }
  #map path.sel { stroke:#d8343c; stroke-width:2.4; }
  #map path.wrong { fill:#ff6b6b !important; }
  #map path.target { fill:#ff5a5a !important; animation:blink .8s infinite alternate; }
  @keyframes blink { from { opacity:1; } to { opacity:.35; } }
  #map circle.mk { stroke:#fff; vector-effect:non-scaling-stroke; stroke-width:1.2; cursor:pointer; }
  #map circle.mk.sel { stroke:#d8343c; stroke-width:2.6; }
  .tip { position:absolute; pointer-events:none; background:rgba(25,35,50,.88); color:#fff; padding:4px 10px; border-radius:8px; font-size:14px; white-space:nowrap; transform:translate(-50%,-130%); display:none; z-index:5; }
  .zoomctl { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px; }
  .zoomctl button { width:38px; height:38px; border:0; border-radius:10px; background:#fff; font-size:20px; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .conts { position:absolute; left:10px; bottom:10px; display:flex; flex-wrap:wrap; gap:5px; max-width:calc(100% - 20px); }
  .conts button { border:0; border-radius:999px; padding:5px 11px; background:rgba(255,255,255,.92); font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.12); }
  .loading { position:absolute; inset:0; display:grid; place-items:center; font-family:'Jua',sans-serif; font-size:22px; color:#1d4f91; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--sub); margin:8px 4px 0; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; }

  .panel { background:var(--card); border-radius:20px; padding:16px; box-shadow:0 4px 0 rgba(0,0,0,.07); min-height:300px; }
  .welcome h2 { font-family:'Jua',sans-serif; font-weight:400; margin:0 0 8px; font-size:24px; color:#1d4f91; }
  .welcome p, .welcome li { font-size:14.5px; line-height:1.6; color:#3d4b5a; }
  .welcome ul { padding-left:18px; margin:6px 0 12px; }
  .chead { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .flag { width:64px; height:44px; object-fit:cover; border-radius:6px; box-shadow:0 0 0 1px rgba(0,0,0,.12); background:#eee; flex:none; }
  .cname { font-family:'Jua',sans-serif; font-size:26px; line-height:1.1; }
  .badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#eef2f7; color:var(--sub); font-weight:700; }
  .badge.t3 { background:#ffe3e3; color:#c2253a; }
  .badge.t2 { background:#fff1cc; color:#9a6a00; }
  .badge.t1 { background:#e2f4ea; color:#1f7a50; }
  .intro { background:#f6f9fc; border-radius:12px; padding:10px 12px; font-size:14.5px; line-height:1.65; margin:10px 0 12px; }
  .intro b { color:#1d4f91; }
  .q { font-family:'Jua',sans-serif; font-size:19px; margin:4px 0 8px; }
  .row { display:flex; gap:8px; }
  .answer { flex:1; min-width:0; font-size:18px; padding:10px 12px; border-radius:12px; border:2px solid #cfd8e2; font-family:inherit; outline:none; }
  .answer:focus { border-color:var(--blue); }
  .hintbox { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .hint { background:#fff8e1; border-left:4px solid var(--gold); padding:7px 10px; border-radius:8px; font-size:14.5px; }
  .hint big { font-family:'Jua',sans-serif; font-size:22px; letter-spacing:3px; color:#9a6a00; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .choices .btn { font-size:15px; padding:9px 6px; }
  .tries { font-size:13px; color:var(--sub); margin-top:6px; }
  .msg { margin-top:10px; padding:10px 12px; border-radius:12px; font-size:15px; line-height:1.55; }
  .msg.ok { background:#e3f7ec; color:#155d3c; }
  .msg.no { background:#ffe8e6; color:#8f1f1f; }
  .msg.info { background:#eaf2ff; color:#1d4f91; }
  .msg .big { font-family:'Jua',sans-serif; font-size:24px; display:block; margin-bottom:2px; }
  .note { margin-top:8px; font-size:13.5px; color:#5a4a20; background:#fff6d8; border-radius:10px; padding:8px 10px; line-height:1.55; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .prog { margin-top:14px; border-top:1px dashed #d5dde6; padding-top:10px; }
  .prog h3 { margin:0 0 6px; font-family:'Jua',sans-serif; font-weight:400; font-size:16px; color:var(--sub); }
  .bar { display:grid; grid-template-columns:76px 1fr 54px; align-items:center; gap:8px; font-size:13px; margin:4px 0; }
  .bar .tr { height:10px; background:#eef2f7; border-radius:99px; overflow:hidden; }
  .bar .fi { height:100%; background:linear-gradient(90deg,#3cc98a,#1f9d6b); border-radius:99px; transition:width .5s; }
  .bar span:last-child { text-align:right; color:var(--sub); }
  .shake { animation:shake .35s; }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .pop { position:fixed; pointer-events:none; font-family:'Jua',sans-serif; font-size:28px; color:var(--red); text-shadow:0 2px 0 #fff; animation:pop 1.2s ease-out forwards; z-index:30; }
  @keyframes pop { from { opacity:1; transform:translate(-50%,0) scale(.8); } to { opacity:0; transform:translate(-50%,-70px) scale(1.2); } }
  .modal { position:fixed; inset:0; background:rgba(20,30,45,.5); display:none; place-items:center; z-index:40; padding:16px; }
  .modal.show { display:grid; }
  .modal .box { background:#fff; border-radius:22px; padding:24px; max-width:420px; width:100%; text-align:center; }
  .modal h2 { font-family:'Jua',sans-serif; font-weight:400; font-size:28px; margin:6px 0; color:#1d4f91; }
  footer.credit { text-align:center; font-size:13px; color:#8a97a5; margin-top:16px; }
  footer.credit b { color:#5d6b7a; }

  @media (max-width:900px) {
    .main { grid-template-columns:1fr; }
    #map { aspect-ratio:auto; height:58vh; }
    h1 { font-size:24px; }
    .panel { min-height:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌏 세계 <span>수도</span> 정복</h1>
    <div class="tabs" role="tablist">
      <button id="tabCap" class="on" onclick="setMode('cap')">🏛️ 수도 맞히기</button>
      <button id="tabFind" onclick="setMode('find')">📍 나라 찾기</button>
    </div>
    <div class="spacer"></div>
    <div class="pill">점수 <b id="score">0</b></div>
    <div class="pill" id="countPill">정복 <b id="cnt">0</b>/<span id="tot">0</span></div>
    <div class="pill">🔥 <b id="streak">0</b>연속</div>
    <div class="pill" id="rank">🧭 견습 탐험가</div>
  </header>

  <div class="main">
    <div>
      <div class="mapbox" id="mapbox">
        <svg id="map" viewBox="0 0 960 500"></svg>
        <div class="loading" id="loading">🌍 세계 지도를 펼치는 중…</div>
        <div class="tip" id="tip"></div>
        <div class="zoomctl">
          <button onclick="zoomBy(1.6)" title="확대">＋</button>
          <button onclick="zoomBy(1/1.6)" title="축소">－</button>
          <button onclick="zoomCont('ALL')" title="전체 보기">🌐</button>
        </div>
        <div class="conts" id="conts"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
  <footer class="credit">세계 수도 정복 · 제작 <b>곱단이 선생님</b> · © 2026 · 국경선 자료 Natural Earth</footer>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// 형식: 지도ID|나라|수도|다른 정답(쉼표)|난이도(1 유명·2 보통·3 희귀)|대륙|국기코드|소개|수도 이야기
const RAW = `
410|대한민국|서울||1|AS|kr|한반도 남쪽에 있는 우리나라예요. 한글을 쓰고, 반도체·K-팝·김치로 세계에 널리 알려져 있어요.|
408|북한|평양||1|AS|kp|한반도 북쪽에 있는 나라로, 1948년부터 남한과 나뉘어 있어요. 민족의 영산 백두산이 있어요.|
392|일본|도쿄|동경|1|AS|jp|4개의 큰 섬으로 이루어진 섬나라예요. 후지산, 애니메이션, 초밥으로 유명해요.|
156|중국|베이징|북경|1|AS|cn|인구가 세계에서 손꼽히게 많은 나라예요. 만리장성, 판다, 수천 년의 역사로 유명해요.|
158|대만|타이베이|타이페이|2|AS|tw|중국 남동쪽 바다에 있는 섬이에요. 반도체 산업과 버블티, 야시장으로 유명해요.|
496|몽골|울란바토르|울란바타르|2|AS|mn|바다가 없는 넓은 초원의 나라예요. 칭기즈 칸의 나라이고, 이동식 천막집 '게르'에서 살기도 해요.|
704|베트남|하노이||1|AS|vn|동남아시아의 길쭉한 S자 모양 나라예요. 쌀국수(퍼)와 커피, 하롱베이로 유명해요.|
418|라오스|비엔티안|위앙짠|3|AS|la|동남아시아에서 유일하게 바다가 없는 나라예요. 메콩강이 흐르고 불교 사원이 많아요.|
116|캄보디아|프놈펜||2|AS|kh|세계에서 가장 큰 사원 앙코르와트가 있는 나라예요. 국기에도 앙코르와트가 그려져 있어요.|
764|태국|방콕||1|AS|th|동남아시아에서 한 번도 식민지가 된 적 없는 왕국이에요. 코끼리와 똠얌꿍으로 유명해요.|
104|미얀마|네피도|네이피도|3|AS|mm|황금빛 불탑이 가득한 불교의 나라예요. 옛날에는 '버마'라고 불렸어요.|2005년에 가장 큰 도시 양곤에서 새로 만든 도시 네피도로 수도를 옮겼어요.
458|말레이시아|쿠알라룸푸르||2|AS|my|말레이반도와 보르네오섬에 걸친 나라예요. 쌍둥이 빌딩 '페트로나스 타워'가 유명해요.|
702|싱가포르|싱가포르||1|AS|sg|서울보다 조금 큰 도시 국가예요. 사자 머리 물고기 '멀라이언'이 상징이에요.|나라 전체가 하나의 도시라서 나라 이름과 수도 이름이 같아요.
360|인도네시아|자카르타|누산타라|2|AS|id|1만 7천 개가 넘는 섬으로 이루어진 나라예요. 인구가 세계 4위이고, 보르네오섬으로 수도 이전을 추진하고 있어요.|보르네오섬에 새 수도 '누산타라'를 짓고 있어요. 누산타라라고 답해도 정답!
608|필리핀|마닐라||1|AS|ph|7천 개가 넘는 섬으로 이루어진 나라예요. 영어를 널리 쓰고 아름다운 해변이 많아요.|
096|브루나이|반다르스리브가완|반다르세리베가완,반다르스리베가완|3|AS|bn|보르네오섬에 있는 작은 이슬람 왕국이에요. 석유가 풍부해서 개인 소득세가 없어요.|
626|동티모르|딜리||3|AS|tl|2002년에 독립한, 21세기 첫 번째 새 나라예요. 티모르섬의 동쪽 절반을 차지해요.|
356|인도|뉴델리|델리|1|AS|in|인구가 세계에서 가장 많은 나라예요. 타지마할, 카레, 영화 산업 '발리우드'로 유명해요.|
586|파키스탄|이슬라마바드||2|AS|pk|인더스 문명이 시작된 곳이에요. 세계에서 두 번째로 높은 봉우리 K2가 있어요.|1960년대에 수도로 쓰려고 새로 만든 계획도시예요. '이슬람의 도시'라는 뜻이에요.
050|방글라데시|다카||2|AS|bd|갠지스강 하류의 땅으로, 인구 밀도가 매우 높은 나라예요. 옷을 많이 만들어 수출해요.|
524|네팔|카트만두||2|AS|np|세계에서 가장 높은 에베레스트산이 있는 나라예요. 국기가 세계에서 유일하게 사각형이 아니에요.|
064|부탄|팀부|팀푸|3|AS|bt|히말라야의 작은 왕국이에요. 돈보다 '국민 행복'을 중요하게 여기는 나라로 유명해요.|
144|스리랑카|스리자야와르데네푸라코테|코테,콜롬보,스리자야와르다나푸라코테|3|AS|lk|인도 남쪽에 있는 눈물방울 모양의 섬나라예요. '실론 홍차'로 유명해요.|공식 수도는 스리자야와르데네푸라코테, 가장 큰 도시는 콜롬보예요. '코테'나 '콜롬보'도 정답으로 인정!
462|몰디브|말레||3|AS|mv|인도양에 1,000개가 넘는 산호섬이 흩어져 있는 나라예요. 세계에서 땅이 가장 낮은 나라예요.|
004|아프가니스탄|카불||2|AS|af|중앙아시아와 남아시아 사이의 산이 많은 나라예요. 옛날 실크로드가 지나던 곳이에요.|
364|이란|테헤란||1|AS|ir|옛 페르시아 제국의 나라예요. 페르시아 양탄자와 석유로 유명해요.|서울에 '테헤란로'가 있을 만큼 우리나라와 인연이 있어요.
368|이라크|바그다드||1|AS|iq|티그리스강과 유프라테스강 사이, 메소포타미아 문명이 시작된 곳이에요.|

const josa = (w, a, b) => { const c = w.charCodeAt(w.length-1) - 0xAC00; return (c >= 0 && c < 11172 && c % 28) ? a : b; };

let AC;
function beep(notes) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    notes.forEach(([f,d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d); t += d*.8; });
  } catch(e) {}
}
const sOK = () => beep([[660,.12],[880,.12],[1175,.25]]);
const sNO = () => beep([[300,.18],[220,.3]]);

const zoom = d3.zoom().scaleExtent([1, 60]).translateExtent([[-50,-50],[W+50,H+50]]).clickDistance(5)

svg.call(zoom).on('dblclick.zoom', null);

function mainPart(f) {
  if (f.geometry.type !== 'MultiPolygon') return f;
  let best = null, ba = -1;
  f.geometry.coordinates.forEach(c => { const p = { type:'Feature', geometry:{ type:'Polygon', coordinates:c } }; const a = d3.geoArea(p); if (a > ba) { ba = a; best = p; } });
  return best;
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r => r.json()).then(topo => {
  features = topojson.feature(topo, topo.objects.countries).features.filter(f => f.id !== '010');
  features.forEach(f => {
    f.key = C[f.id] ? f.id : (f.properties.name === 'Kosovo' ? 'XK' : null);
    if (f.key && byKey[f.key]) f.key = null; // 중복 방지
    if (f.key) byKey[f.key] = f;
  });
  projection = d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]], { type:'FeatureCollection', features });
  path = d3.geoPath(projection);

  gC.selectAll('path').data(features).join('path')
    .attr('d', path)
    .on('click', (e, d) => d.key && onPick(d.key, e))
    .on('mousemove', (e, d) => showTip(e, d.key))
    .on('mouseleave', hideTip);

  // 지도 자료에 모양이 없는 아주 작은 나라는 점으로만 표시
  const EXTRA = { '798':[179.2,-8.52] };
  const extra = Object.entries(EXTRA).filter(([k]) => !byKey[k]).map(([k,xy]) => { const f = { type:'Feature', id:k, key:k, geometry:{ type:'Point', coordinates:xy } }; byKey[k] = f; return f; });
  const small = features.filter(f => f.key && path.area(f) < 22).concat(extra);
  gM.selectAll('circle').data(small).join('circle')
    .attr('class', 'mk')
    .attr('cx', d => path.centroid(mainPart(d))[0]).attr('cy', d => path.centroid(mainPart(d))[1]).attr('r', 4.5)
    .on('click', (e, d) => onPick(d.key, e))
    .on('mousemove', (e, d) => showTip(e, d.key))
    .on('mouseleave', hideTip);

  $('loading').remove();
  $('tot').textContent = keys().length;
  paint(); hud(); renderPanel();
}).catch(() => { $('loading').textContent = '😢 지도를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해 주세요.'; });

const keys = () => Object.keys(byKey);

function status(k) {
  if (mode === 'cap') return S.conq[k] != null ? 'win' : S.fail[k] ? 'fail' : 'k-' + C[k].cont;
  return S.found[k] ? 'win' : 'k-plain';
}
function paint() {
  gC.selectAll('path').attr('class', d => !d.key ? 'nodata' : 'c ' + status(d.key) + (sel === d.key ? ' sel' : ''));
  gM.selectAll('circle').attr('class', d => 'mk ' + status(d.key) + (sel === d.key ? ' sel' : ''))
    .style('fill', d => { const st = status(d.key); return st === 'win' ? '#1f9d6b' : st === 'fail' ? '#ef6b61' : '#ff7a59'; });
  gC.selectAll('path.sel').raise();
}

const tip = $('tip');
function showTip(e, k) {
  if (!k) { hideTip(); return; }
  const showName = mode === 'cap' || S.found[k];
  if (!showName) { hideTip(); return; }
  const r = $('mapbox').getBoundingClientRect();
  let t = C[k].name;
  if (mode === 'cap' && S.conq[k] != null) t += ' · ' + C[k].cap + ' ✅';
  if (mode === 'cap' && S.fail[k]) t += ' · ' + C[k].cap;
  tip.textContent = t; tip.style.display = 'block';
  tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

function projBox(box) {
  const [[a,b],[c,d]] = box, pts = [];
  for (let i=0;i<=8;i++) for (let j=0;j<=8;j++) pts.push(projection([a+(c-a)*i/8, b+(d-b)*j/8]));
  return [[d3.min(pts,p=>p[0]), d3.min(pts,p=>p[1])], [d3.max(pts,p=>p[0]), d3.max(pts,p=>p[1])]];
}
function zoomToBounds([[x0,y0],[x1,y1]], maxK = 12) {
  const k = Math.max(1, Math.min(maxK, 0.85 / Math.max((x1-x0)/W, (y1-y0)/H)));
  svg.transition().duration(800).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2, -(y0+y1)/2));
}
function zoomCont(c) { if (!projection) return; c === 'ALL' ? svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity) : zoomToBounds(projBox(CONT_BOX[c]), 8); }
function zoomCountry(k, maxK = 7) { const f = byKey[k]; if (f) zoomToBounds(path.bounds(mainPart(f)), maxK); }
function zoomBy(f) { svg.transition().duration(300).call(zoom.scaleBy, f); }

$('conts').innerHTML = Object.entries(CONT).map(([c,n]) => `<button onclick="zoomCont('${c}')">${n}</button>`).join('');

}

function progressHTML() {
  const tot = {}, got = {};

function popAt(e, text) {
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;

      <ul>
        <li>★ 유명한 나라 <b>10점</b> · ★★ 보통 나라 <b>20점</b> · ★★★ 숨은 나라 <b>30점</b> (가산점!)</li>
        <li>💡 힌트: 첫 글자 → 초성 → 보기 4개 (쓸수록 점수가 줄어요)</li>
        <li>기회는 3번! 3번 연속 맞히면 🔥 <b>연속 보너스 +5점</b></li>
        <li>작은 나라는 <span style="color:#ff7a59">●</span> 점을 누르세요. 마우스 휠·손가락으로 확대할 수 있어요.</li>
      </ul>
      <div class="actions"><button class="btn primary" onclick="randomCountry()">🎲 아무 나라나 골라줘</button></div>
    </div>` + progressHTML();
    return;
  }
  const c = C[sel], t = TIER[c.tier];
  let h = `<div class="chead"><img class="flag" src="${flagUrl(c.a2)}" alt="${esc(c.name)} 국기" onerror="this.style.visibility='hidden'">
    <div><div class="cname">${esc(c.name)}</div><div class="badges"><span class="badge">${CONT[c.cont]}</span><span class="badge t${c.tier}">${t.label}${t.bonus ? ' +' + t.bonus : ''}</span></div></div></div>
    <div class="intro">${esc(c.intro)}</div>`;

  if (S.conq[sel] != null || S.fail[sel]) {
    const won = S.conq[sel] != null;
    h += `<div class="msg ${won ? 'ok' : 'no'}"><span class="big">🏛️ 수도: ${esc(c.cap)}</span>${won ? `이미 정복한 나라예요! (+${S.conq[sel]}점)` : '지난번에 아쉽게 놓친 나라예요. 이번엔 꼭 기억해요!'}</div>`;
    if (c.note) h += `<div class="note">💬 ${esc(c.note)}</div>`;
    h += `<div class="actions"><button class="btn primary" onclick="randomCountry()">🎲 다음 나라</button><button class="btn ghost" onclick="zoomCountry('${sel}')">🔍 위치 확대</button></div>`;
    P.innerHTML = h + progressHTML();
    return;
  }

  const g = game, possible = Math.max(1, Math.round((t.base + t.bonus) * HINT_RATE[g.hint] * Math.pow(0.8, g.wrong)));
  h += `<div class="q">🏛️ ${esc(c.name)}의 수도는 어디일까요?</div>`;
  if (g.hint < 3) {
    h += `<div class="row" id="ansRow"><input class="answer" id="ans" placeholder="수도 이름을 입력하세요" autocomplete="off" value="${esc(g.last)}" onkeydown="if(event.key==='Enter')submitAns()"><button class="btn primary" onclick="submitAns()">확인</button></div>`;
  }
  h += `<div class="hintbox">`;
  const main = c.cap.replace(/\s/g,'');
  if (g.hint >= 1) h += `<div class="hint">💡 힌트 1: <b>${[...main].length}글자</b>, 첫 글자는 <big>${main[0]}</big></div>`;
  if (g.hint >= 2) h += `<div class="hint">💡 힌트 2: 초성 <big>${chosung(c.cap)}</big></div>`;
  if (g.hint >= 3) {
    if (!g.choices) {
      const pool = shuffle(keys().filter(k => k !== sel && C[k].cont === c.cont && C[k].cap !== c.cap)).slice(0,3).map(k => C[k].cap);
      g.choices = shuffle([c.cap, ...pool]);
    }
    h += `<div class="hint">💡 힌트 3: 이 중에 정답이 있어요!</div><div class="choices" id="ansRow">${g.choices.map(x => `<button class="btn ghost" onclick="submitAns(this.textContent)">${esc(x)}</button>`).join('')}</div>`;
  }
  h += `</div><div class="tries">남은 기회 ${'❤️'.repeat(3 - g.wrong)}${'🤍'.repeat(g.wrong)} · 지금 맞히면 <b>${possible}점</b>${S.streak >= 2 ? ' + 🔥 연속 보너스' : ''}</div>`;
  h += `<div class="actions">${g.hint < 3 ? `<button class="btn gold" onclick="useHint()">💡 힌트 보기 (${['첫 글자','초성','보기 4개'][g.hint]})</button>` : ''}<button class="btn ghost" onclick="giveUp()">🏳️ 포기</button><button class="btn ghost" onclick="zoomCountry('${sel}')">🔍 위치</button></div>`;
  h += `<div id="msg"></div>`;
  P.innerHTML = h + progressHTML();
}

function useHint() { if (!game || game.hint >= 3) return; const a = $('ans'); if (a) game.last = a.value; game.hint++; renderPanel(); const b = $('ans'); b && b.focus(); }

function submitAns(v) {
  if (!game) return;
  const c = C[game.k];
  const val = v != null ? v : ($('ans') ? $('ans').value : '');
  if (!val.trim()) { const a = $('ans'); a && a.focus(); return; }
  const ok = [c.cap, ...c.alts].some(x => norm(x) === norm(val));
  if (ok) return win(c);
  game.wrong++; game.last = '';
  sNO(); S.streak = 0; hud(); save();
  if (game.wrong >= 3) return lose(c, val);
  if (game.choices) game.choices = game.choices.filter(x => x !== val);
  renderPanel();
  const row = $('ansRow'); row && row.classList.add('shake');
  $('msg').innerHTML = `<div class="msg no">❌ '${esc(val)}'${josa(val,'은','는')} 정답이 아니에요. 다시 생각해 봐요!${game.hint < 3 ? ' 힌트를 써 보는 것도 좋아요.' : ''}</div>`;
  const a = $('ans'); a && a.focus();
}

function win(c) {
  const t = TIER[c.tier], rate = HINT_RATE[game.hint] * Math.pow(0.8, game.wrong);
  const base = Math.max(1, Math.round(t.base * rate)), bonus = Math.round(t.bonus * rate);
  S.streak++; S.best = Math.max(S.best, S.streak);
  const sb = S.streak >= 3 ? 5 : 0;
  const pts = base + bonus + sb;
  S.score += pts; S.conq[c.id] = pts; save();
  sOK(); popAt(window.event, '+' + pts);
  game = null; paint(); hud(); renderPanel();
  let detail = `기본 ${base}점`; if (bonus) detail += ` + 숨은 나라 가산점 ${bonus}점`; if (sb) detail += ` + 🔥${S.streak}연속 보너스 ${sb}점`;
  $('panel').querySelector('.msg').outerHTML = `<div class="msg ok"><span class="big">🎉 정답! ${esc(c.cap)}</span>${c.name}${josa(c.name,'을','를')} 정복했어요! <b>+${pts}점</b><br><small>${detail}</small></div>`;
  checkFinish();
}
function lose(c) {
  S.fail[c.id] = 1; save(); game = null; paint(); hud(); renderPanel();
  $('panel').querySelector('.msg').outerHTML = `<div class="msg no"><span class="big">😢 정답은 ${esc(c.cap)}</span>아쉽지만 괜찮아요. 이제 ${c.name}의 수도를 알게 됐어요!</div>`;
  checkFinish();
}
function giveUp() { if (!game) return; S.streak = 0; sNO(); lose(C[game.k]); }

function checkFinish() { const n = keys().length; if (Object.keys(S.conq).length + Object.keys(S.fail).length >= n) setTimeout(finishModal, 900); }
function finishModal() {
  const n = keys().length, won = Object.keys(S.conq).length;
  $('modalBox').innerHTML = `<div style="font-size:56px">🌏👑</div><h2>세계 일주 완료!</h2>
    <p>${n}개 나라 중 <b>${won}개</b>를 정복했어요.<br>최종 점수 <b style="color:var(--red);font-size:22px">${S.score}점</b> · 최고 연속 ${S.best}번</p>
    <p style="font-size:14px;color:#5d6b7a">놓친 나라는 지도에서 빨간색이에요. 다시 눌러 수도를 복습해 보세요!</p>
    <div class="actions" style="justify-content:center"><button class="btn primary" onclick="$('modal').classList.remove('show')">지도 보기</button><button class="btn ghost" onclick="resetAll()">처음부터 다시</button></div>`;
  $('modal').classList.add('show');
}
function resetAll() {
  if (!confirm('지금까지의 기록을 모두 지우고 처음부터 할까요?')) return;
  S = { score:0, conq:{}, fail:{}, found:{}, findScore:0, streak:0, best:0 }; save();
  $('modal').classList.remove('show'); setMode(mode); zoomCont('ALL');
}

// ---------- 나라 찾기 모드 ----------
function newFind() {
  const left = keys().filter(k => !S.found[k]);
  gC.selectAll('path').classed('target', false);
  if (!left.length) { findQ = null; renderFind(true); return; }
  findQ = { k: left[Math.floor(Math.random()*left.length)], wrong:0, hint:0, done:false };
  sel = null; paint(); renderFind();
}
function renderFind(allDone) {
  const P = $('panel');
  if (!findQ) {
    P.innerHTML = `<div class="welcome"><h2>📍 나라 찾기</h2>
      <p>${allDone ? '🎉 모든 나라의 위치를 찾았어요! 대단해요!' : '나라 이름이 나오면 <b>지도에서 그 나라를 찾아 클릭</b>하세요. 이번엔 지도에 이름이 안 나와요!'}</p>
      <ul><li>★ 10점 · ★★ 20점 · ★★★ 30점</li><li>틀릴 때마다 점수가 조금씩 줄고, 3번 틀리면 정답을 알려줘요.</li><li>💡 힌트를 누르면 어느 대륙인지 확대해서 보여줘요.</li></ul>
      <div class="actions"><button class="btn primary" onclick="newFind()">▶ 시작하기</button><button class="btn ghost" onclick="resetFind()">찾기 기록 지우기</button></div></div>` + progressHTML();
    return;
  }
  const c = C[findQ.k], t = TIER[c.tier];
  let h = `<div class="q" style="font-size:16px;color:var(--sub)">이 나라는 어디에 있을까요?</div>
    <div class="chead"><img class="flag" src="${flagUrl(c.a2)}" alt="" onerror="this.style.visibility='hidden'"><div><div class="cname">${esc(c.name)}</div><div class="badges"><span class="badge t${c.tier}">${t.label}</span>${findQ.hint ? `<span class="badge">${CONT[c.cont]}</span>` : ''}</div></div></div>`;
  if (findQ.done) {
    h += `<div class="intro">${esc(c.intro)}<br>🏛️ 수도는 <b>${esc(c.cap)}</b>${josa(c.cap.replace(/[^가-힣]/g,'') || '가', '이에요', '예요')}.</div>`;
  } else {
    h += `<div class="tries" style="font-size:14px">남은 기회 ${'❤️'.repeat(3 - findQ.wrong)}${'🤍'.repeat(findQ.wrong)}</div>`;
  }
  h += `<div id="msg"></div><div class="actions">` + (findQ.done
    ? `<button class="btn primary" onclick="newFind()">▶ 다음 나라</button>`
    : `${!findQ.hint ? `<button class="btn gold" onclick="findHint()">💡 대륙 힌트</button>` : ''}<button class="btn ghost" onclick="findGiveUp()">🏳️ 모르겠어요</button>`) + `</div>`;
  P.innerHTML = h + progressHTML();
}
function findHint() { if (!findQ) return; findQ.hint = 1; zoomCont(C[findQ.k].cont); renderFind(); }
function findClick(k, e) {
  if (!findQ || findQ.done) { if (S.found[k]) { sel = k; paint(); } return; }
  const c = C[findQ.k];
  if (k === findQ.k) {
    const t = TIER[c.tier], rate = Math.pow(0.7, findQ.wrong) * (findQ.hint ? 0.7 : 1);
    S.streak++; S.best = Math.max(S.best, S.streak);
    const pts = Math.max(1, Math.round((t.base + t.bonus) * rate)) + (S.streak >= 3 ? 5 : 0);
    S.findScore += pts; S.found[k] = 1; save();
    findQ.done = true; sel = k; sOK(); popAt(e, '+' + pts); paint(); hud(); renderFind();
    $('msg').innerHTML = `<div class="msg ok"><span class="big">🎯 찾았다! +${pts}점</span></div>`;
    return;
  }
  findQ.wrong++; S.streak = 0; sNO(); save(); hud();
  const p = gC.selectAll('path').filter(d => d.key === k); p.classed('wrong', true); setTimeout(() => p.classed('wrong', false), 900);
  const nm = C[k].name, ie = josa(nm, '이에요', '예요');
  if (findQ.wrong >= 3) return revealFind(`그건 ${nm}${ie}.`);
  renderFind();
  $('msg').innerHTML = `<div class="msg no">❌ 그건 <b>${esc(nm)}</b>${ie}. 다시 찾아봐요!</div>`;
}
function revealFind(pre) {
  const c = C[findQ.k]; findQ.done = true; S.streak = 0; save(); hud();
  sel = findQ.k; paint();
  gC.selectAll('path').filter(d => d.key === findQ.k).classed('target', true);
  zoomCountry(findQ.k, 6);
  renderFind();
  $('msg').innerHTML = `<div class="msg no">${pre ? esc(pre) + ' ' : ''}<b>${esc(c.name)}</b>${josa(c.name,'은','는')} 깜빡이는 곳이에요. 위치를 기억해 둬요!</div>`;
  setTimeout(() => gC.selectAll('path').classed('target', false), 4000);
}
function findGiveUp() { if (findQ && !findQ.done) { sNO(); revealFind(); } }
function resetFind() { if (!confirm('나라 찾기 기록을 지울까요?')) return; S.found = {}; S.findScore = 0; save(); paint(); hud(); renderFind(); }

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').classList.remove('show'); });
</script>
</body>
</html>
