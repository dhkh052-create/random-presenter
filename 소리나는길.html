<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리가 나는 길</title>
<meta name="author" content="곱단이 선생님">
<meta name="description" content="한글 자음과 모음이 입안 어디에서 어떻게 소리 나는지 움직이는 그림으로 보여 주는 학습 자료 · 제작 곱단이 선생님">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b2433; --sub:#6b6275; --card:#fff; --red:#d8343c; --blue:#2f7de1; --air:#3aa7ff;

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:linear-gradient(180deg,#fff4ec,#f3f0ff); color:var(--ink); font-family:'Noto Sans KR','Malgun Gothic',sans-serif; }
  .wrap { max-width:1300px; margin:0 auto; padding:12px 16px 24px; }
  .jua { font-family:'Jua',sans-serif; font-weight:400; }
  header { display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 14px; margin-bottom:10px; }
  h1 { margin:0; font-family:'Jua',sans-serif; font-weight:400; font-size:32px; color:#7a2e4a; }
  .lead { font-size:14.5px; color:var(--sub); margin:0; line-height:1.55; }
  .lead b { color:var(--ink); }
  .main { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:14px; align-items:start; }
  .card { background:var(--card); border-radius:20px; padding:14px; box-shadow:0 4px 0 rgba(0,0,0,.06); }
  .stage { position:sticky; top:10px; }
  #mouth { width:100%; height:auto; display:block; background:#fffaf6; border-radius:14px; }
  .views { position:relative; }
  .front { position:absolute; right:8px; top:8px; width:29%; background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(80,30,45,.15); padding:6px 6px 2px; }
  .fhead { font-family:'Jua',sans-serif; font-size:13px; color:#7a2e4a; text-align:center; }
  .places { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .places button { border:0; border-radius:999px; padding:5px 10px 5px 6px; background:#f4f1f7; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:inherit; color:var(--ink); }
  .places button i { width:20px; height:20px; border-radius:50%; color:#fff; font-style:normal; font-size:12px; display:grid; place-items:center; font-weight:700; }
  .places button.on { box-shadow:0 0 0 2px currentColor inset; }
  .ctrl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .btn { border:0; border-radius:12px; padding:8px 13px; font-family:'Jua',sans-serif; font-size:16px; cursor:pointer; background:#f0ecf5; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .btn.primary { background:#7a2e4a; color:#fff; box-shadow:0 3px 0 #4f1a2f; }
  .btn.on { background:#ffe28a; }
  .now { margin-top:10px; background:#fbf7ff; border-radius:14px; padding:10px 12px; min-height:92px; }
  .now .title { font-family:'Jua',sans-serif; font-size:21px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
  .now .title big { font-size:40px; line-height:1; color:#7a2e4a; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; }
  .tag { font-family:'Noto Sans KR',sans-serif; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; }
  .steps { list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:4px; }
  .steps li { font-size:14.5px; line-height:1.5; padding:5px 9px; border-radius:9px; color:#9a92a5; transition:all .2s; }
  .steps li.cur { background:#fff; color:var(--ink); box-shadow:0 0 0 2px #e8b5c8 inset; font-weight:700; }
  .steps li.done { color:var(--ink); }
  .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button { border:0; border-radius:999px; padding:8px 16px; font-family:'Jua',sans-serif; font-size:18px; cursor:pointer; background:#fff; color:var(--sub); box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .tabs button.on { background:#7a2e4a; color:#fff; }
  h2 { font-family:'Jua',sans-serif; font-weight:400; font-size:21px; margin:4px 0 8px; color:#7a2e4a; }
  h3 { font-family:'Jua',sans-serif; font-weight:400; font-size:18px; margin:16px 0 6px; }
  p.desc { font-size:14px; line-height:1.6; color:var(--sub); margin:0 0 8px; }
  table.ct { width:100%; border-collapse:separate; border-spacing:3px; table-layout:fixed; }
  .ct th { font-size:12.5px; font-weight:700; padding:6px 2px; border-radius:8px; background:#f4f1f7; cursor:pointer; line-height:1.3; }
  .ct th small { display:block; font-weight:400; color:var(--sub); font-size:11px; }
  .ct th.corner { background:transparent; cursor:default; }
  .ct td { text-align:center; padding:0; }
  .ct td button { width:100%; min-height:46px; border:0; border-radius:10px; background:#fff; box-shadow:0 0 0 1.5px #e7e0ee inset; font-family:'Jua',sans-serif; font-size:28px; cursor:pointer; color:var(--ink); }
  .ct td button:hover { background:#fff5f8; }
  .ct td button.on { background:#7a2e4a; color:#fff; box-shadow:none; }
  .ct td.empty { background:#faf8fc; border-radius:10px; }
  .ph { font-size:11px !important; }
  .info { background:#fbf7ff; border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.65; margin-top:10px; }
  .info b { color:#7a2e4a; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mini { background:#fff; border-radius:12px; padding:9px 10px; box-shadow:0 0 0 1.5px #eee6f3 inset; font-size:13.5px; line-height:1.55; }
  .mini b { display:block; font-family:'Jua',sans-serif; font-weight:400; font-size:17px; margin-bottom:2px; }
  .pairs { display:flex; flex-wrap:wrap; gap:6px; }
  .pairs .btn { font-size:15px; }
  .tip { margin-top:10px; background:#fff8dc; border-radius:12px; padding:9px 12px; font-size:13.5px; line-height:1.6; }
  .vwrap { max-width:420px; }
  #trap { width:100%; height:auto; display:block; }
  #lipsFront { width:100%; height:auto; display:block; }
  .vt td button { font-size:30px; min-height:52px; }
  footer.credit { text-align:center; font-size:13px; color:#9a92a5; margin-top:16px; }
  footer.credit b { color:#6b6275; }
  .warn { font-size:12.5px; color:#a0662a; margin-top:6px; display:none; }
  @media (max-width:900px) {
    .main { grid-template-columns:1fr; }
    .stage { position:static; }
  }
  @media (max-width:600px) {
    .front { position:static; width:62%; margin:8px auto 0; box-shadow:0 0 0 1.5px #eee6f3 inset; }
    h1 { font-size:26px; }
    .grid3 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👄 소리가 나는 길</h1>
    <p class="lead">말소리는 <b>허파의 공기</b>가 <b>목청</b>을 지나 <b>입</b>이나 <b>코</b>로 나가면서 만들어져요. 공기 길을 <b>어디에서(조음 위치)</b>, <b>어떻게(조음 방법)</b> 막거나 좁히느냐에 따라 서로 다른 소리가 나요.</p>
  </header>

  <div class="main">
    <section class="card stage">
      <div class="views">
        <svg id="mouth" viewBox="0 0 420 440" aria-label="입안 옆모습 그림"></svg>
        <div class="front"><div class="fhead">👄 앞에서 본 입</div><svg id="lipsFront" viewBox="0 0 160 118" aria-label="앞에서 본 입술 모양"></svg></div>
      </div>
      <div class="places" id="places"></div>
      <div class="ctrl">
        <button class="btn primary" id="replay" onclick="replay()">▶ 다시 보기</button>
        <button class="btn" id="slowBtn" onclick="toggleSlow()">🐢 천천히</button>
        <button class="btn on" id="sndBtn" onclick="toggleSound()">🔊 소리 켜짐</button>
        <button class="btn" onclick="toRest()">↺ 처음 자세</button>
      </div>
      <div class="warn" id="warn">이 기기에는 한국어 음성이 없어 소리가 나오지 않을 수 있어요. 그림 움직임은 그대로 볼 수 있어요.</div>
      <div class="now" id="now"><div class="title">오른쪽에서 자음이나 모음을 눌러 보세요 👉</div>
        <ul class="steps"><li class="done">파란 점은 공기의 흐름이에요. 빨간 동그라미는 소리가 만들어지는 곳이에요.</li></ul></div>
    </section>

    <section>
      <div class="tabs">
        <button id="tabC" class="on" onclick="setTab('C')">자음 (닿소리)</button>
        <button id="tabV" onclick="setTab('V')">단모음 (홀소리)</button>
        <button id="tabD" onclick="setTab('D')">이중 모음</button>
      </div>
      <div id="paneC" class="card"></div>
      <div id="paneV" class="card" hidden></div>
      <div id="paneD" class="card" hidden></div>
    </section>
  </div>
  <footer class="credit">소리가 나는 길 · 제작 <b>곱단이 선생님</b> · © 2026 · 소리는 기기의 음성 합성으로 들려줘요</footer>
</div>

}
trap.innerHTML = `<path d="M${TR.fx0},${TR.top} L${TR.fx1},${TR.top} L${TR.fx1},${TR.bot} L${TR.fx0+80},${TR.bot} Z" fill="#fbf7ff" stroke="#d9cdea" stroke-width="2"/>
  <text x="${TR.fx0+12}" y="12" font-size="11" fill="#3b7ddd" font-family="Noto Sans KR">← 앞(전설)</text><text x="${TR.fx1}" y="12" font-size="11" fill="#3b7ddd" text-anchor="end" font-family="Noto Sans KR">뒤(후설) →</text>
  <text x="6" y="${TR.top+6}" font-size="11" fill="#d8343c" font-family="Noto Sans KR">고</text><text x="40" y="${(TR.top+TR.bot)/2+4}" font-size="11" fill="#d8343c" font-family="Noto Sans KR">중</text><text x="${TR.fx0+60}" y="${TR.bot+4}" font-size="11" fill="#d8343c" font-family="Noto Sans KR">저</text>
  <text x="150" y="183" font-size="11" fill="#6b6275" text-anchor="middle" font-family="Noto Sans KR">입 모양 크게 벌어짐 ↓</text>`;
Object.entries(VOW).forEach(([v,d]) => {
  const [x,y] = vpos(d.tg, d.rnd);
  const g = document.createElementNS(NS, 'g'); g.style.cursor = 'pointer'; g.addEventListener('click', () => playVowel(v));
  g.innerHTML = `<circle cx="${x}" cy="${y}" r="13" fill="${d.rnd ? '#ffe3ee' : '#eef6e2'}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-family="Jua" fill="#2b2433">${v}</text>`;
  trap.appendChild(g);
});
const tdot = document.createElementNS(NS, 'circle'); tdot.setAttribute('r', 6); tdot.setAttribute('fill', '#d8343c'); tdot.setAttribute('opacity', .85); trap.appendChild(tdot);
// 앞에서 본 입술
const lf = document.getElementById('lipsFront');
lf.innerHTML = `
  <defs><clipPath id="fmClip"><ellipse id="fmClipE" cx="80" cy="56"/></clipPath></defs>
  <rect x="4" y="2" width="152" height="94" rx="30" fill="#ffdcc6"/>
  <path d="M68,8 Q80,16 92,8" fill="none" stroke="#e8b89c" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse id="fmOpen" cx="80" cy="56" fill="#5b2333"/>
  <g clip-path="url(#fmClip)">
    <rect id="fmTeethU" fill="#fff"/><rect id="fmTeethL" fill="#f3efe9"/>
    <ellipse id="fmTongue" fill="#ef6f7c"/>
  </g>
  <path id="fmUp" fill="#e9868f"/><path id="fmLo" fill="#e47a85"/>
  <path id="fmSeam" fill="none" stroke="#a8505e" stroke-width="1.6" stroke-linecap="round"/>
  <text id="fmPuff" x="10" y="30" font-size="13" font-family="Jua" fill="#1565c0" opacity="0">후~</text>
  <text id="fmTxt" x="80" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6b6275" font-family="Noto Sans KR"></text>`;
const F = id => document.getElementById(id);
const fm = { clip:F('fmClipE'), open:F('fmOpen'), tu:F('fmTeethU'), tl:F('fmTeethL'), tongue:F('fmTongue'), up:F('fmUp'), lo:F('fmLo'), seam:F('fmSeam'), puff:F('fmPuff'), txt:F('fmTxt') };
(function frontLoop() {
  const r = cur.rnd, g = cur.gap, cx = 80, cy = 56 + cur.jaw * .25;
  const spread = (g < 10 && r < .5) ? (10 - g) * .6 : 0;
  const w = 34 - r*18 + spread;                       // 입 너비의 절반
  const h = g < .6 ? 0 : g*0.85 + r*3;                 // 입 벌림의 절반
  const th = 9 + r*4;                                  // 입술 두께 (오므리면 도톰)
  const L = cx - w - 5, R = cx + w + 5;
  [fm.clip, fm.open].forEach(e => { e.setAttribute('cx', cx); e.setAttribute('cy', cy); e.setAttribute('rx', Math.max(.1, w)); e.setAttribute('ry', Math.max(.1, h)); });
  fm.tu.setAttribute('x', cx - w*.75); fm.tu.setAttribute('width', w*1.5); fm.tu.setAttribute('y', cy - h - 1); fm.tu.setAttribute('height', Math.min(8, h*.55));
  fm.tl.setAttribute('x', cx - w*.6); fm.tl.setAttribute('width', w*1.2); fm.tl.setAttribute('y', cy + h - Math.min(5, h*.3)); fm.tl.setAttribute('height', 6);
  const lift = Math.max(0, (232 - cur.tg[3][1])) * .32;
  fm.tongue.setAttribute('cx', cx); fm.tongue.setAttribute('cy', cy + h + 3 - lift); fm.tongue.setAttribute('rx', w*.8); fm.tongue.setAttribute('ry', 9);
  fm.up.setAttribute('d', `M${L},${cy} Q${cx - w*.55},${cy - h - th - 4} ${cx - 5},${cy - h - th + 1} Q${cx},${cy - h - th + 4} ${cx + 5},${cy - h - th + 1} Q${cx + w*.55},${cy - h - th - 4} ${R},${cy} Q${cx + w*.5},${cy - h - 1} ${cx},${cy - h} Q${cx - w*.5},${cy - h - 1} ${L},${cy} Z`);
  fm.lo.setAttribute('d', `M${L},${cy} Q${cx - w*.5},${cy + h + 1} ${cx},${cy + h} Q${cx + w*.5},${cy + h + 1} ${R},${cy} Q${cx + w*.6},${cy + h + th + 6} ${cx},${cy + h + th + 5} Q${cx - w*.6},${cy + h + th + 6} ${L},${cy} Z`);
  fm.seam.setAttribute('d', h < .5 ? `M${L + 3},${cy} Q${cx},${cy + 1.5} ${R - 3},${cy}` : '');
  fm.puff.setAttribute('opacity', frees.length > 15 ? .9 : 0);
  fm.txt.textContent = g < 1 ? '입술을 꼭 다묾' : r > .5 ? '둥글게 오므려 내밂 (원순)' : g > 15 ? '입을 크게 벌림' : g < 8 ? '옆으로 평평하게 (평순)' : '알맞게 벌림 (평순)';
  const [x,y] = vpos(cur.tg, r); tdot.setAttribute('cx', x); tdot.setAttribute('cy', y);
  requestAnimationFrame(frontLoop);
})();

// 탭
function setTab(t) {
  ['C','V','D'].forEach(k => { $('pane'+k).hidden = k !== t; $('tab'+k).classList.toggle('on', k === t); });
}
function markOn(ch) { document.querySelectorAll('[data-ch]').forEach(b => b.classList.toggle('on', b.dataset.ch === ch)); document.querySelectorAll('.places button').forEach(b => b.classList.remove('on')); }

draw(); airLoop();
</script>
